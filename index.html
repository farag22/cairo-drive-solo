    onlineChannel=onlineClient.channel('cairo-drivers-'+room,{config:{broadcast:{self:false},presence:{key:onlineId}}});
    onlineChannel.on('broadcast',{event:'driver'},({payload})=>{if(payload&&payload.id&&payload.id!==onlineId){const o=onlinePeers.get(payload.id)||{};onlinePeers.set(payload.id,{...payload,rl:o.rl,rt:o.rt,seen:Date.now()})}});
    onlineChannel.on('presence',{event:'sync'},()=>{
      const state=onlineChannel.presenceState();
      for(const [id,rows] of Object.entries(state)){if(id===onlineId)continue;const p=rows&&rows[0];if(p&&p.id&&!onlinePeers.has(p.id))onlinePeers.set(p.id,{...p,playing:false,seen:Date.now()});}
      for(const id of [...onlinePeers.keys()])if(!state[id])onlinePeers.delete(id);
      if(onlineReady)onlineMsg('متصل — '+(Object.keys(state).length)+' سائق في الغرفة');
    });
    onlineChannel.on('presence',{event:'leave'},({key})=>{onlinePeers.delete(key)});
    onlineChannel.subscribe(async status=>{
      if(status==='SUBSCRIBED'){
        onlineReady=true;onlineMsg('متصل! ابدأ الرحلة لتظهر عربيات اللاعبين الآخرين.');
        await onlineChannel.track({id:onlineId,name,route:roadRoute,lane:px,trip,speed:v,paint:sv.paint,onlineAt:Date.now()});
        if(b){b.textContent='متصل بالغرفة ✓';b.disabled=false;}
      }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
        onlineReady=false;onlineMsg('فشل الاتصال: تحقق من الرابط والمفتاح وإعدادات Realtime.');if(b){b.disabled=false;b.textContent='إعادة المحاولة';}
      }
    });
    if(b){b.textContent='جاري انتظار الخادم...';}
  }catch(err){onlineReady=false;onlineMsg(err.message||'تعذر الاتصال');if(b){b.disabled=false;b.textContent='إعادة المحاولة';}}
}
function publishOnlineState(){
  if(!onlineReady||!onlineChannel)return;
  const modal=document.getElementById('online-modal');let name='سائق';try{name=(JSON.parse(localStorage.getItem('cc2online')||'{}').name||'سائق')}catch(e){}
  const payload={id:onlineId,name,route:roadRoute,lane:px,trip,speed:v,paint:sv.paint,dir:dir,br:!!(keys.ArrowDown||keys.s||[...ptr.values()].some(p=>p.b==='br')),playing:st==='play',ts:Date.now()};
  onlineChannel.send({type:'broadcast',event:'driver',payload}).catch(()=>{});
}
function onlineEntries(){
  const out=[];if(!onlineReady||st!=='play')return out;const now=Date.now();
  for(const [id,p] of onlinePeers){
    if(now-(p.seen||p.ts||now)>10000){onlinePeers.delete(id);continue;}
    if(p.playing===false||p.route!==roadRoute)continue;
    const tl=Math.max(-2.4,Math.min(2.4,Number(p.lane)||0)),tt=Number(p.trip)||0;
    p.rl=p.rl===undefined?tl:p.rl+(tl-p.rl)*.25;
    p.rt=p.rt===undefined?tt:p.rt+(tt-p.rt)*.25;
    const z=PZ+(p.rt-trip)*1000;
    if(z<1.5||z>230)continue;
    out.push({z,f:()=>{
      // نفس شكل عربية اللاعب بالظبط (ميكروباص بلون الدهان اللي اختاره صاحبها)
      const o={k:'m',w:1.05,h:1.25,c:PAINT[p.paint]||'#efece2'};
      veh(p.rl,z,o,(Number(p.dir)||0)*.035,!!p.br);
      const q=pj(p.rl,z);
      if(q[2]>5)txt(String(p.name||'سائق').slice(0,14),q[0],q[1]-o.h*q[2]-4,Math.max(8,Math.min(13,q[2]*.35)),'#fff','center',800,3);
    }});
  }
  return out;
}
setInterval(()=>{if(onlineReady){publishOnlineState();const now=Date.now();for(const [id,p] of onlinePeers)if(now-(p.seen||now)>12000)onlinePeers.delete(id);}},350);

function loop(ts){
  const d=Math.min((ts-last)/1000||.016,.033);last=ts;t+=d;
  if(st==='play'){update(d);toasts.forEach(o=>o.a-=d);toasts=toasts.filter(o=>o.a>0)}
  else if(st==='menu'||st==='load'){if(st==='load'){ld+=d/2.8;if(ld>=1){st='menu';scr='hub'}}trav+=70*K*d;curT+=70*K*d/700;cur=Math.sin(curT)*Math.cos(curT*.37);cx=0}
  engine();frame();requestAnimationFrame(loop);
}
applyCam();stReset();reset();obj=[];requestAnimationFrame(loop);
// input
addEventListener('keydown',e=>{keys[e.key]=true;
  if(st==='play'&&roadRoute===0&&!junctionChoice&&nextJunction-trip<.85&&nextJunction-trip>-.05){if(e.key==='ArrowLeft')chooseTurn('left');else if(e.key==='ArrowRight')chooseTurn('right');else if(e.key==='ArrowUp')chooseTurn('straight')}
  if(e.key==='h')horn();if(e.key==='m')engOn=!engOn;if(e.key==='r')radio();if(e.key==='n')music();if(e.key==='c')camNext();if(e.key==='l')lightsOn=!lightsOn;
  if(e.key==='p'||e.key==='Escape'){if(st==='play')st='pause';else if(st==='pause')st='play'}
  if((e.key==='Enter'||e.key===' ')&&(st==='menu'||st==='win'||st==='lose'))start();
  if(e.key===' ')e.preventDefault()});
addEventListener('keyup',e=>delete keys[e.key]);
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
const hit=(a,b,k)=>Math.hypot(a-BTN[k][0],b-BTN[k][1])<BTN[k][2]+8;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();cv.setPointerCapture(e.pointerId);const[a,b]=pos(e);
  if(st==='win'||st==='lose'){st='menu';scr='hub';return}if(st==='menu'){uiTap(a,b);return}
  if(st==='pause'){uiTap(a,b);return}
  if(hit(a,b,'pause')){st='pause';return}
  if(st==='play'&&roadRoute===0&&!junctionChoice&&nextJunction-trip<.85&&nextJunction-trip>-.05&&b>=230&&b<=257){if(a>=130&&a<192){chooseTurn('left');return}if(a>=192&&a<258){chooseTurn('straight');return}if(a>=258&&a<=324){chooseTurn('right');return}}
  let bt=null;if(hit(a,b,'br'))bt='br';else if(hit(a,b,'bo'))bt='bo';else if(hit(a,b,'h')){bt='h';horn()}else if(hit(a,b,'eng')){engOn=!engOn;return}else if(hit(a,b,'rad')){radio();return}else if(hit(a,b,'mus')){music();return}else if(hit(a,b,'cam')){camNext();return}else if(hit(a,b,'lit')){lightsOn=!lightsOn;return}else if(sv.acc===1&&hit(a,b,'gas'))bt='gas';
  ptr.set(e.pointerId,{x:a,b:bt});
});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(p)p.x=pos(e)[0]});
for(const ev of['pointerup','pointercancel'])cv.addEventListener(ev,e=>{ptr.delete(e.pointerId);if(ev==='pointerup')doPerm()});
