name: Update audio playlist

on:
  push:
    branches:
      - main
    paths:
      - 'audio/**'
      - '.github/workflows/update-audio-playlist.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-playlist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate playlist from audio files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          audio_dir = Path('audio')
          extensions = {'.mp3', '.ogg', '.wav', '.m4a', '.aac', '.opus', '.webm', '.flac'}
          tracks = sorted(
              (p.name for p in audio_dir.iterdir()
               if p.is_file() and p.suffix.lower() in extensions),
              key=str.casefold,
          )
          playlist = {'tracks': [{'name': name} for name in tracks]}
          (audio_dir / 'playlist.json').write_text(
              json.dumps(playlist, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'Found {len(tracks)} audio file(s)')
          PY

      - name: Commit playlist when it changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/playlist.json
          if git diff --cached --quiet; then
            echo 'Playlist is already up to date.'
          else
            git commit -m 'chore: refresh audio playlist'
            git push origin HEAD:main
          fi
